name: Compilar APK de TuGymBro

# Se ejecuta automáticamente cada vez que se sube código a la rama principal,
# y también se puede disparar a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.13 (la versión que necesita este proyecto)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: TuGymBro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
