name: Compilar APK de TuGymBro

# Se ejecuta automáticamente cada vez que se sube código a la rama principal,
# y también se puede disparar a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución al gradlew
        run: chmod +x ./gradlew || true

      - name: Compilar APK de debug
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: TuGymBro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
